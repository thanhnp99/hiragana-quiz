<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Game trắc nghiệm Hiragana & Katakana 4 đáp án và luyện viết chữ theo nét: xem chữ, nghe phát âm và chọn romaji đúng.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff6b6b'/%3E%3Ctext y='76' x='50' text-anchor='middle' font-size='68' fill='%23ffffff'%3E%E3%81%82%3C/text%3E%3C/svg%3E">
    <title>Game Quiz Hiragana &amp; Katakana - Trắc nghiệm 4 đáp án</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #ff6b6b;
            margin-bottom: 5px;
        }
        .score {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
        .character-box {
            font-size: 100px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            background: #eef2f5;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .character-box:hover {
            background: #dfe6e9;
        }
        
        /* Grid chứa 4 đáp án */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .option-btn {
            padding: 15px;
            font-size: 20px;
            border: 2px solid #ddd;
            background-color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            color: #333;
        }
        
        .option-btn:hover:not(:disabled) {
            background-color: #f1f2f6;
            border-color: #3498db;
        }
        
        /* Trạng thái đúng/sai cho nút đáp án */
        .option-btn.correct-ans {
            background-color: #4cd137 !important;
            color: white !important;
            border-color: #4cd137 !important;
        }
        
        .option-btn.wrong-ans {
            background-color: #e84118 !important;
            color: white !important;
            border-color: #e84118 !important;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 10px 20px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-hint { background-color: #fbc531; color: white; }
        .btn-hint:hover { background-color: #e1b12c; }

        .btn-audio { background-color: #3498db; color: white; }
        .btn-audio:hover { background-color: #2980b9; }
        
        .message {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 25px;
        }
        .correct { color: #4cd137; }
        .wrong { color: #e84118; }
        
        .hint-box {
            background-color: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 15px;
            display: none;
            border: 1px solid #ffeeba;
        }
        .hint-ex {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #e0c687;
            font-size: 14px;
        }
        .hint-ex b { font-size: 16px; }

        /* ==== Nhập đáp án romaji ==== */
        .input-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .romaji-input {
            width: 200px;
            padding: 12px 16px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #b8d4f0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        .romaji-input:focus { border-color: #3498db; }
        .romaji-input.correct-ans { border-color: #27ae60; background-color: #e8f8f0; }
        .romaji-input.wrong-ans { border-color: #e84118; background-color: #fdecea; }
        .romaji-input:disabled { background-color: #eee; }
        .btn-submit {
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 22px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover { background-color: #2980b9; }
        .btn-submit:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .input-type-label {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: #7f8c8d;
            min-height: 18px;
        }

        /* ==== Màn hình chọn chế độ ==== */
        .screen {
            display: none;
            width: 100%;
            justify-content: center;
        }
        .screen.active {
            display: flex;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .back-btn {
            border: none;
            background: #eef2f5;
            color: #555;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .back-btn:hover { background: #dfe6e9; color: #2c3e50; }
        .mode-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 18px;
            margin-bottom: 14px;
            border: 2px solid #dfe6e9;
            background: #fff;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }
        .mode-btn:hover { border-color: #3498db; background: #f7fbff; transform: translateY(-2px); }
        .mode-icon { font-size: 30px; }
        .mode-btn small {
            display: block;
            font-weight: normal;
            font-size: 13px;
            color: #888;
            margin-top: 3px;
        }
        .home-sub { color: #888; margin-top: 0; font-size: 15px; }

        /* Chọn bộ chữ Hiragana / Katakana */
        .script-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .script-btn {
            flex: 1;
            padding: 8px 0;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #dfe6e9;
            background: #fff;
            color: #555;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s;
        }
        .script-btn:hover { border-color: #3498db; color: #3498db; }
        .script-btn.active {
            background: #3498db;
            border-color: #3498db;
            color: #fff;
        }

        /* ==== Màn hình viết chữ ==== */
        .write-box { max-width: 420px; }
        .kana-picker {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin-bottom: 12px;
        }
        .kana-btn {
            padding: 6px 0;
            font-size: 17px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.15s;
        }
        .kana-btn:hover { border-color: #3498db; }
        .kana-btn.active { background: #3498db; border-color: #3498db; color: #fff; }
        .write-char {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        #write-svg {
            display: block;
            width: 100%;
            max-width: 360px;
            height: auto;
            margin: 0 auto 8px;
            background: #fff;
            border: 2px solid #dfe6e9;
            border-radius: 14px;
            touch-action: none;
            cursor: crosshair;
        }
        .model-stroke {
            fill: none;
            stroke: #ccd6dd;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .user-stroke {
            fill: none;
            stroke: #2c3e50;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .user-stroke.wrong { stroke: #e84118; }
        .start-dot { fill: #3498db; stroke: #fff; stroke-width: 2; }
        .start-num { fill: #fff; font-size: 9px; font-weight: bold; text-anchor: middle; }
        .stroke-progress {
            text-align: center;
            color: #555;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .btn-demo { background-color: #9b59b6; color: #fff; }
        .btn-demo:hover { background-color: #8e44ad; }
        .btn-undo { background-color: #7f8fa6; color: #fff; }
        .btn-undo:hover { background-color: #718096; }
        .btn-clear { background-color: #e84118; color: #fff; }
        .btn-clear:hover { background-color: #d63031; }
        .credit {
            font-size: 11px;
            color: #aaa;
            text-align: center;
            margin-top: 8px;
        }
        .credit a { color: #aaa; }

        /* Màn hình nhỏ: thu gọn để không bị tràn */
        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 24px;
            }
            .character-box {
                font-size: 72px;
                padding: 15px;
            }
            .options-grid {
                gap: 8px;
            }
            .option-btn {
                font-size: 17px;
                padding: 12px 8px;
            }
            .message {
                font-size: 16px;
            }
            .kana-picker {
                grid-template-columns: repeat(6, 1fr);
            }
            .kana-btn {
                font-size: 15px;
                padding: 5px 0;
            }
        }
    </style>
</head>
<body>

<!-- Màn hình chọn chế độ -->
<div class="screen active" id="screen-home">
    <div class="container">
        <h1>Kana Practice</h1>
        <p class="home-sub">46 Hiragana + 46 Katakana</p>

        <button class="mode-btn" onclick="showScreen('quiz')">
            <span class="mode-icon">📝</span>
            <span>Trắc nghiệm Hiragana<small>Xem chữ, nghe và chọn romaji đúng</small></span>
        </button>

        <button class="mode-btn" onclick="showScreen('quiz-katakana')">
            <span class="mode-icon">🗣️</span>
            <span>Trắc nghiệm Katakana<small>46 chữ cái báo hiệu, cùng 4 đáp án</small></span>
        </button>

        <button class="mode-btn" onclick="showScreen('write')">
            <span class="mode-icon">✍️</span>
            <span>Viết chữ<small>Luyện viết nét theo Hiragana hoặc Katakana</small></span>
        </button>
    </div>
</div>

<!-- Màn hình trắc nghiệm -->
<div class="screen" id="screen-quiz">
<div class="container">
    <div class="top-bar">
        <button class="back-btn" onclick="showScreen('home')">← Quay lại</button>
    </div>
    <h1 id="quiz-title">Hiragana Quiz</h1>
    <div class="score">Điểm của bạn: <span id="score-val">0</span></div>
    
    <div class="character-box" id="character-display" onclick="playAudio()" title="Nhấn để nghe">あ</div>
    
    <!-- Vùng chứa 4 đáp án -->
    <div class="options-grid" id="options-container">
        <!-- Các nút sẽ được tạo bằng Javascript -->
    </div>
    
    <!-- Vùng nhập đáp án (trộn xen kẽ với trắc nghiệm) -->
    <div class="input-area" id="input-area" style="display:none">
        <input type="text" id="romaji-input" class="romaji-input" autocomplete="off"
               autocapitalize="off" spellcheck="false"
               placeholder="Romaji hoặc kana..." />
        <button class="action-btn btn-submit" onclick="checkInputAnswer()">Trả lời</button>
    </div>
    <div class="input-type-label" id="input-type-label"></div>
    
    <div class="btn-group">
        <button class="action-btn btn-audio" onclick="playAudio()">🔊 Nghe</button>
        <button class="action-btn btn-hint" onclick="showHint()">Gợi ý</button>
    </div>
    
    <div class="message" id="message" aria-live="polite"></div>
    <div class="hint-box" id="hint-box"></div>
</div>
</div>

<!-- Màn hình viết chữ -->
<div class="screen" id="screen-write">
<div class="container write-box">
    <div class="top-bar">
        <button class="back-btn" onclick="showScreen('home')">← Quay lại</button>
        <div class="score" style="margin-bottom:0">Viết đúng: <span id="write-score">0</span></div>
    </div>
    <h1>Viết chữ</h1>

    <!-- Chọn bộ chữ -->
    <div class="script-switch">
        <button class="script-btn active" data-script="hiragana" onclick="setWriteScript('hiragana')">Hiragana</button>
        <button class="script-btn" data-script="katakana" onclick="setWriteScript('katakana')">Katakana</button>
    </div>

    <!-- Chọn chữ cần luyện -->
    <div class="kana-picker" id="kana-picker"></div>

    <div class="write-char" id="write-char-label">あ (a)</div>

    <svg id="write-svg" viewBox="0 0 109 109" aria-label="Khung viết chữ">
        <g id="write-grid"></g>
        <g id="write-model"></g>
        <g id="write-user"></g>
        <g id="write-markers"></g>
    </svg>

    <div class="stroke-progress" id="stroke-progress">Nét: 0/0</div>

    <div class="btn-group">
        <button class="action-btn btn-audio" onclick="playWriteAudio()">🔊 Nghe</button>
        <button class="action-btn btn-demo" onclick="animateModel()">▶ Xem mẫu</button>
        <button class="action-btn btn-undo" onclick="undoStroke()">⤺ Lùi nét</button>
        <button class="action-btn btn-clear" onclick="clearStrokes()">🗑 Xóa</button>
    </div>

    <div class="message" id="write-message" aria-live="polite"></div>
    <div class="credit">Thiết kế nét chữ: <a href="http://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a> (CC BY-SA 3.0)</div>
</div>
</div>

<script src="strokes.js"></script>
<script>
    // Từ vựng ví dụ lấy theo giáo trình JPD133 (Từ vựng 1-15)
    const hiraganaData = [
        { char: 'あ', romaji: 'a', hint: 'Như chữ A có bụng to, miệng hô "a—" dài — đọc "a".', ex: { w: 'あさ', r: 'asa', vn: 'Buổi sáng' } },
        { char: 'い', romaji: 'i', hint: 'Hai nét thẳng đứng như hai ngón tay chụm lại — đọc "i".', ex: { w: '行きます（いきます）', r: 'ikimasu', vn: 'Đi' } },
        { char: 'う', romaji: 'u', hint: 'Chữ U nằm ngang, đội thêm một nét nhỏ ở trên đầu — đọc "u".', ex: { w: 'うさぎ', r: 'usagi', vn: 'Con thỏ' } },
        { char: 'え', romaji: 'e', hint: 'Như chữ Z bị ngoắt thêm một cái đuôi — đọc "e" (ê).', ex: { w: '駅（えき）', r: 'eki', vn: 'Nhà ga' } },
        { char: 'お', romaji: 'o', hint: 'Như chữ あ nhưng thêm một chấm ở vai phải — đọc "o" (ôi).', ex: { w: '音楽（おんがく）', r: 'ongaku', vn: 'Âm nhạc' } },
        { char: 'か', romaji: 'ka', hint: 'Như chữ K bị nghiêng, thêm một nét chéo nhỏ — đọc "ka".', ex: { w: 'かばん', r: 'kaban', vn: 'Cặp, túi xách' } },
        { char: 'き', romaji: 'ki', hint: 'Trông như cái chìa khóa (key) — đọc "ki".', ex: { w: 'きって', r: 'kitte', vn: 'Tem' } },
        { char: 'く', romaji: 'ku', hint: 'Như cái mỏ chim đang há ra — kêu "ku ku" — đọc "ku".', ex: { w: 'くつ', r: 'kutsu', vn: 'Giày' } },
        { char: 'け', romaji: 'ke', hint: 'Như một thanh kiếm cắm xuống đất — đọc "ke" (ken nghĩa là kiếm).', ex: { w: 'けさ', r: 'kesa', vn: 'Sáng nay' } },
        { char: 'こ', romaji: 'ko', hint: 'Hai nét ngang như hai con cá koi bơi song song — đọc "ko".', ex: { w: '子ども（こども）', r: 'kodomo', vn: 'Đứa trẻ, con' } },
        { char: 'さ', romaji: 'sa', hint: 'Như chữ き nhưng chỉ còn 1 vạch ngang — đọc "sa".', ex: { w: 'さかな', r: 'sakana', vn: 'Cá' } },
        { char: 'し', romaji: 'shi', hint: 'Như cái lưỡi câu cá — đọc "shi".', ex: { w: '仕事（しごと）', r: 'shigoto', vn: 'Công việc' } },
        { char: 'す', romaji: 'su', hint: 'Sợi dây bị thắt nút vòng tròn ở giữa — đọc "su".', ex: { w: 'すし', r: 'sushi', vn: 'Món sushi' } },
        { char: 'せ', romaji: 'se', hint: 'Như chữ E nằm nghiêng: 1 vạch ngang + 2 nét đứng — đọc "se" (sếp).', ex: { w: '先生（せんせい）', r: 'sensei', vn: 'Thầy/Cô giáo' } },
        { char: 'そ', romaji: 'so', hint: 'Như chữ Z bị bẻ thêm một nét cong phía dưới — đọc "so".', ex: { w: 'そば', r: 'soba', vn: 'Món mì soba' } },
        { char: 'た', romaji: 'ta', hint: 'Như chữ "t" và chữ "a" ghép lại — đọc "ta" (tà).', ex: { w: 'たまご', r: 'tamago', vn: 'Trứng' } },
        { char: 'ち', romaji: 'chi', hint: 'Như số 5 có cái bụng bự — đọc "chi".', ex: { w: '父（ちち）', r: 'chichi', vn: 'Bố (của mình)' } },
        { char: 'つ', romaji: 'tsu', hint: 'Như cơn sóng thần (Tsunami) — đọc "tsu".', ex: { w: '作ります（つくります）', r: 'tsukurimasu', vn: 'Làm, chế tạo' } },
        { char: 'て', romaji: 'te', hint: 'Như chữ T bị bẻ cong — đọc "te" (tê).', ex: { w: '手紙（てがみ）', r: 'tegami', vn: 'Thư' } },
        { char: 'と', romaji: 'to', hint: 'Như chữ C bị cắm thêm một gạch chéo — đọc "to".', ex: { w: '時計（とけい）', r: 'tokei', vn: 'Đồng hồ' } },
        { char: 'な', romaji: 'na', hint: 'Nét cuối thắt một cái nút như cái nơ — đọc "na" (na ná).', ex: { w: '名前（なまえ）', r: 'namae', vn: 'Tên' } },
        { char: 'に', romaji: 'ni', hint: 'Nét đứng bên trái + 2 vạch ngang như số 2 — "ni" chính là số 2 trong tiếng Nhật.', ex: { w: '日本（にほん）', r: 'nihon', vn: 'Nhật Bản' } },
        { char: 'ぬ', romaji: 'nu', hint: 'Nét cuối thắt nút như sợi bún rối — đọc "nu".', ex: { w: '脱ぎます（ぬぎます）', r: 'nugimasu', vn: 'Cởi (quần áo)' } },
        { char: 'ね', romaji: 'ne', hint: 'Như con mèo (neko) với cái đuôi xoắn nút — đọc "ne".', ex: { w: '猫（ねこ）', r: 'neko', vn: 'Con mèo' } },
        { char: 'の', romaji: 'no', hint: 'Như biển báo cấm (NO) — đọc "no".', ex: { w: '飲み物（のみもの）', r: 'nomimono', vn: 'Đồ uống' } },
        { char: 'は', romaji: 'ha', hint: 'Nét bên phải như cây bút cắm vào sợi dây, nghe như cười "ha ha" — đọc "ha".', ex: { w: '花（はな）', r: 'hana', vn: 'Hoa' } },
        { char: 'ひ', romaji: 'hi', hint: 'Như khuôn mặt cười hếch miệng — cười "hi hi" — đọc "hi".', ex: { w: '飛行機（ひこうき）', r: 'hikouki', vn: 'Máy bay' } },
        { char: 'ふ', romaji: 'fu', hint: 'Như đỉnh núi Phú Sĩ — đọc "fu" (Phú).', ex: { w: '冬（ふゆ）', r: 'fuyu', vn: 'Mùa đông' } },
        { char: 'へ', romaji: 'he', hint: 'Như cái đỉnh của một ngọn núi — đọc "he".', ex: { w: '部屋（へや）', r: 'heya', vn: 'Căn phòng' } },
        { char: 'ほ', romaji: 'ho', hint: 'Như chữ は nhưng thêm một vạch ngang trên đầu — đọc "ho" (hô).', ex: { w: '本（ほん）', r: 'hon', vn: 'Sách' } },

    let currentQuestion = {};
    let score = 0;
    let lastIndex = -1;
    let jaVoice = null;
    let activeSet = 'hiragana'; // bộ chữ đang làm quiz: 'hiragana' | 'katakana'

    function currentData() {
        return activeSet === 'katakana' ? katakanaData : hiraganaData;
    }

    const charDisplay = document.getElementById('character-display');
    const optionsContainer = document.getElementById('options-container');
    const messageEl = document.getElementById('message');
    const hintBox = document.getElementById('hint-box');
    const scoreVal = document.getElementById('score-val');
    const inputArea = document.getElementById('input-area');
    const romajiInput = document.getElementById('romaji-input');
    const inputTypeLabel = document.getElementById('input-type-label');

    // Trộn xen kẽ: câu lẻ = trắc nghiệm, câu chẵn = nhập đáp án
    let questionCount = 0;
    let isInputQuestion = false;

    // Xáo trộn mảng tại chỗ theo Fisher-Yates
    function shuffle(list) {
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }
        return list;
    }

    // Hàm tạo 4 lựa chọn ngẫu nhiên (1 đúng + 3 sai)
    function generateOptions(correctAnswer) {
        const wrongOnes = shuffle(
            currentData().map(item => item.romaji).filter(romaji => romaji !== correctAnswer)
        );

        return shuffle([correctAnswer, ...wrongOnes.slice(0, 3)]);
    }

    // Chuẩn hóa + chấp nhận biến thể romaji (shi/si, chi/ti...) và kana
    function normalizeInput(s) {
        return s.toLowerCase().replace(/[\s\-']/g, '');
    }

    const ROMAJI_VARIANTS = {
        si: 'shi', ti: 'chi', tu: 'tsu', hu: 'fu', zi: 'ji', di: 'ji', du: 'zu',
        she: 'shi', che: 'chi', tse: 'tsu', dzu: 'zu', wi: 'i', wu: 'u', we: 'e', wo: 'o',
        nn: 'n', n: 'n'
    };

    function isCorrectInput(raw, question) {
        const val = normalizeInput(raw);
        if (!val) return false;
        if (val === question.char) return true;
        if (val === question.romaji) return true;
        // を/ヲ đọc là "o" — chấp nhận cả "wo" và "o"
        if (question.romaji === 'wo' && (val === 'o' || val === 'wo')) return true;
        const alt = ROMAJI_VARIANTS[val];
        if (alt && alt === question.romaji) return true;
        if (question.romaji === 'n' && (val === 'nn' || val === "n'")) return true;
        return false;
    }

    function nextQuestion() {
        // Xoá thông báo cũ
        messageEl.textContent = '';
        messageEl.className = 'message';
        hintBox.style.display = 'none';

        // Lấy chữ cái ngẫu nhiên làm câu hỏi (không lặp chữ vừa làm)
        const dataList = currentData();
        let randomIndex = Math.floor(Math.random() * dataList.length);
        while (randomIndex === lastIndex) {
            randomIndex = Math.floor(Math.random() * dataList.length);
        }
        lastIndex = randomIndex;
        currentQuestion = dataList[randomIndex];
        charDisplay.textContent = currentQuestion.char;

        // Xen kẽ: câu lẻ trắc nghiệm, câu chẵn nhập romaji
        isInputQuestion = questionCount % 2 === 1;
        questionCount++;

        if (isInputQuestion) {
            optionsContainer.style.display = 'none';
            inputArea.style.display = 'flex';
            inputTypeLabel.textContent = 'Nhập romaji hoặc gõ kana để trả lời';
            romajiInput.value = '';
            romajiInput.className = 'romaji-input';
            romajiInput.disabled = false;
            romajiInput.focus();
        } else {
            inputArea.style.display = 'none';
            optionsContainer.style.display = '';
            inputTypeLabel.textContent = '';

            // Render 4 nút lựa chọn
            const options = generateOptions(currentQuestion.romaji);
            optionsContainer.innerHTML = ''; // Làm sạch container trước

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }
    }

    // Chọn giọng đọc tiếng Nhật (danh sách giọng load bất đồng bộ)
    function pickJapaneseVoice() {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices();
        jaVoice = voices.find(voice => voice.lang && voice.lang.toLowerCase().startsWith('ja')) || null;
    }

    if ('speechSynthesis' in window) {
        pickJapaneseVoice();
        window.speechSynthesis.onvoiceschanged = pickJapaneseVoice;
    }

    // Đọc âm thanh tiếng Nhật (mặc định đọc chữ của câu hỏi)
    function playAudio(text) {
        const value = text || (currentQuestion && currentQuestion.char);
        if (!value) return;

        if (!('speechSynthesis' in window)) {
            alert("Trình duyệt của bạn không hỗ trợ phát âm thanh.");
            return;
        }

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(value);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.8;
        if (jaVoice) utterance.voice = jaVoice;
        window.speechSynthesis.speak(utterance);
    }

    function showHint() {
        let html = `<strong>Mẹo nhớ:</strong> ${currentQuestion.hint}`;
        const ex = currentQuestion.ex;
        if (ex) {
            if (ex.note) {
                html += `<div class="hint-ex">${ex.note}</div>`;
            } else {
                html += `<div class="hint-ex">Ví dụ: <b>${ex.w}</b> (${ex.r}) – ${ex.vn}</div>`;
            }
        }
        hintBox.innerHTML = html;
        hintBox.style.display = 'block';
    }

    // Chấm điểm khi click vào 1 trong 4 đáp án
    function checkAnswer(selectedOption, btnElement) {
        // Vô hiệu hoá tất cả các nút để tránh click liên tiếp
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        if (selectedOption === currentQuestion.romaji) {
            btnElement.classList.add('correct-ans');
            messageEl.textContent = 'Chính xác!';
            messageEl.className = 'message correct';
            score++;
            scoreVal.textContent = score;
            
            // Nếu đúng, qua câu mới nhanh hơn (1 giây)
            setTimeout(nextQuestion, 1000);
        } else {
            btnElement.classList.add('wrong-ans');
            
            // Tìm và bôi xanh luôn cả đáp án đúng để người dùng biết
            allBtns.forEach(btn => {
                if (btn.textContent === currentQuestion.romaji) {
                    btn.classList.add('correct-ans');
                }
            });
            
            messageEl.textContent = `Sai rồi! Đáp án đúng là "${currentQuestion.romaji}"`;
            messageEl.className = 'message wrong';
            score = 0; 
            scoreVal.textContent = score;
            
            // Nếu sai, dừng lâu hơn một chút (1.8 giây) để học sinh kịp nhìn đáp án
            setTimeout(nextQuestion, 1800);
        }
    }

    // Chấm điểm câu nhập romaji / kana
    function checkInputAnswer() {
        if (romajiInput.disabled) return;
        const raw = romajiInput.value;
        if (!raw.trim()) return;

        romajiInput.disabled = true;
        const ex = currentQuestion.ex;
        const exText = ex ? (ex.note ? ex.note : `Ví dụ: ${ex.w} (${ex.r}) – ${ex.vn}`) : '';

        if (isCorrectInput(raw, currentQuestion)) {
            romajiInput.classList.add('correct-ans');
            messageEl.textContent = 'Chính xác!' + (exText ? ' ' + exText : '');
            messageEl.className = 'message correct';
            score++;
            scoreVal.textContent = score;
            setTimeout(nextQuestion, 1200);
        } else {
            romajiInput.classList.add('wrong-ans');
            messageEl.textContent = `Sai rồi! Đáp án đúng là "${currentQuestion.romaji}"` + (exText ? ' — ' + exText : '');
            messageEl.className = 'message wrong';
            score = 0;
            scoreVal.textContent = score;
            setTimeout(nextQuestion, 2200);
        }
    }

    // Enter để trả lời ở ô nhập
    romajiInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkInputAnswer();
    });

    // =================== CHUYỂN MÀN HÌNH ===================
    let quizStarted = { hiragana: false, katakana: false };
    let writeStarted = false;

    // Tên hash -> màn hình (quiz Hiragana và Katakana dùng chung màn hình)
    const SCREEN_OF = { home: 'home', quiz: 'quiz', 'quiz-katakana': 'quiz', write: 'write' };

    function showScreen(name) {
        const screenName = SCREEN_OF[name] || 'home';
        if (!SCREEN_OF[name]) name = 'home';

        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.toggle('active', screen.id === 'screen-' + screenName);
        });

        if (screenName === 'quiz') {
            const set = name === 'quiz-katakana' ? 'katakana' : 'hiragana';
            document.getElementById('quiz-title').textContent =
                set === 'katakana' ? 'Katakana Quiz' : 'Hiragana Quiz';

            if (activeSet !== set || !quizStarted[set]) {
                activeSet = set;
                quizStarted[set] = true;
                score = 0;
                scoreVal.textContent = score;
                lastIndex = -1;
                questionCount = 0;
                nextQuestion();
            }
        }
        if (screenName === 'write' && !writeStarted) {
            writeStarted = true;
            initWriteScreen();
        }

        if (location.hash !== '#' + name) {
            try { history.replaceState(null, '', '#' + name); } catch (error) { /* bỏ qua */ }
        }
    }

    window.addEventListener('hashchange', () => showScreen(location.hash.slice(1)));

    // =================== CHẾ ĐỘ VIẾT CHỮ (MỨC A) ===================
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const START_TOLERANCE = 24; // sai số cho phép so với điểm bắt đầu của nét mẫu (đơn vị 109)
    const END_TOLERANCE = 32;

    let writeChar = 'あ';
    let writeScript = 'hiragana'; // bộ chữ đang luyện viết: 'hiragana' | 'katakana'
    let modelPathEls = [];
    let userStrokeEls = [];
    let expectedStroke = 0;
    let writeScore = 0;
    let drawing = false;
    let drawingPoints = [];
    let drawingPathEl = null;
    let demoRunning = false;
    let writeAdvanceTimer = null;

    const writeSvg = document.getElementById('write-svg');
    const writeMessageEl = document.getElementById('write-message');
    const strokeProgressEl = document.getElementById('stroke-progress');
    const writeScoreVal = document.getElementById('write-score');
    const writeCharLabel = document.getElementById('write-char-label');

    function initWriteScreen() {
        buildWriteGrid();
        buildKanaPicker();
        selectKana(writeChar);
        writeSvg.addEventListener('pointerdown', onWritePointerDown);
        writeSvg.addEventListener('pointermove', onWritePointerMove);
        writeSvg.addEventListener('pointerup', onWritePointerUp);
        writeSvg.addEventListener('pointercancel', onWritePointerUp);
    }

    function setWriteMessage(text, type) {
        writeMessageEl.textContent = text;
        writeMessageEl.className = 'message' + (type ? ' ' + type : '');
    }

    function updateStrokeProgress() {
        strokeProgressEl.textContent = `Nét: ${expectedStroke}/${modelPathEls.length}`;
    }

    // Khung "ます": ô vuông + đường dẫn giữa và đường chéo
    function buildWriteGrid() {
        const grid = document.getElementById('write-grid');
        grid.innerHTML = '';
        const size = 109;
        const half = size / 2;
        const add = (tag, attrs) => {
            const el = document.createElementNS(SVG_NS, tag);
            Object.keys(attrs).forEach(key => el.setAttribute(key, attrs[key]));
            grid.appendChild(el);
        };

        add('rect', { x: 3, y: 3, width: size - 6, height: size - 6, rx: 8, fill: '#fff', stroke: '#c9d6df', 'stroke-width': 2 });
        add('line', { x1: half, y1: 7, x2: half, y2: size - 7, stroke: '#e3ebf0', 'stroke-width': 1.5, 'stroke-dasharray': '6 6' });
        add('line', { x1: 7, y1: half, x2: size - 7, y2: half, stroke: '#e3ebf0', 'stroke-width': 1.5, 'stroke-dasharray': '6 6' });
        add('line', { x1: 9, y1: 9, x2: size - 9, y2: size - 9, stroke: '#eef3f6', 'stroke-width': 1.2, 'stroke-dasharray': '4 8' });
        add('line', { x1: size - 9, y1: 9, x2: 9, y2: size - 9, stroke: '#eef3f6', 'stroke-width': 1.2, 'stroke-dasharray': '4 8' });
    }

    function writeData() {
        return writeScript === 'katakana' ? katakanaData : hiraganaData;
    }

    function strokeDataFor(ch) {
        const source = writeScript === 'katakana'
            ? (typeof KATAKANA_STROKE_DATA !== 'undefined' ? KATAKANA_STROKE_DATA : null)
            : (typeof STROKE_DATA !== 'undefined' ? STROKE_DATA : null);
        return source ? source[ch] : null;
    }

    function setWriteScript(script) {
        if (script !== 'hiragana' && script !== 'katakana') return;
        if (script === writeScript) return;
        writeScript = script;

        document.querySelectorAll('.script-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.script === script);
        });

        buildKanaPicker();
        selectKana(writeData()[0].char);
    }

    function buildKanaPicker() {
        const picker = document.getElementById('kana-picker');
        picker.innerHTML = '';
        writeData().forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'kana-btn';
            btn.type = 'button';
            btn.textContent = item.char;
            btn.onclick = () => selectKana(item.char);
            picker.appendChild(btn);
        });
    }

    function selectKana(ch) {
        writeChar = ch;
        clearTimeout(writeAdvanceTimer);

        document.querySelectorAll('.kana-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent === ch);
        });

        const item = writeData().find(entry => entry.char === ch);
        writeCharLabel.textContent = item ? `${ch} (${item.romaji})` : ch;
        loadModel();
    }

    function loadModel() {
        const modelG = document.getElementById('write-model');
        const userG = document.getElementById('write-user');
        const markersG = document.getElementById('write-markers');
        modelG.innerHTML = '';
        userG.innerHTML = '';
        markersG.innerHTML = '';
        modelPathEls = [];
        userStrokeEls = [];
        expectedStroke = 0;
        drawing = false;
        demoRunning = false;

        const paths = strokeDataFor(writeChar);
        if (!paths || !paths.length) {
            updateStrokeProgress();
            setWriteMessage('Chưa có dữ liệu nét cho chữ này.', 'wrong');
            return;
        }

        paths.forEach(d => {
            const path = document.createElementNS(SVG_NS, 'path');
            path.setAttribute('d', d);
            path.setAttribute('class', 'model-stroke');
            modelG.appendChild(path);
            modelPathEls.push(path);
        });

        updateStrokeProgress();
        drawStartMarker();
        setWriteMessage('Vẽ nét 1 từ chấm xanh.', '');
    }

    // Chấm tròn đánh dấu điểm bắt đầu của nét kế tiếp
    function drawStartMarker() {
        const markersG = document.getElementById('write-markers');
        markersG.innerHTML = '';
        if (expectedStroke >= modelPathEls.length) return;

        const start = modelPathEls[expectedStroke].getPointAtLength(0);

        const circle = document.createElementNS(SVG_NS, 'circle');
        circle.setAttribute('cx', start.x);
        circle.setAttribute('cy', start.y);
        circle.setAttribute('r', 7.5);
        circle.setAttribute('class', 'start-dot');
        markersG.appendChild(circle);

        const text = document.createElementNS(SVG_NS, 'text');
        text.setAttribute('x', start.x);
        text.setAttribute('y', start.y + 3.2);
        text.setAttribute('class', 'start-num');
        text.textContent = expectedStroke + 1;
        markersG.appendChild(text);
    }

    function svgPointFromEvent(evt) {
        const point = writeSvg.createSVGPoint();
        point.x = evt.clientX;
        point.y = evt.clientY;
        const matrix = writeSvg.getScreenCTM();
        return matrix ? point.matrixTransform(matrix.inverse()) : point;
    }

    function pointsToPathData(points) {
        if (points.length < 2) return '';
        let d = `M${points[0].x.toFixed(2)},${points[0].y.toFixed(2)}`;
        for (let i = 1; i < points.length - 1; i++) {
            const midX = (points[i].x + points[i + 1].x) / 2;
            const midY = (points[i].y + points[i + 1].y) / 2;
            d += ` Q${points[i].x.toFixed(2)},${points[i].y.toFixed(2)} ${midX.toFixed(2)},${midY.toFixed(2)}`;
        }
        const last = points[points.length - 1];
        d += ` L${last.x.toFixed(2)},${last.y.toFixed(2)}`;
        return d;
    }

    function pathLengthOf(points) {
        let total = 0;
        for (let i = 1; i < points.length; i++) {
            total += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
        }
        return total;
    }

    function onWritePointerDown(evt) {
        if (demoRunning) return;
        if (!modelPathEls.length) {
            setWriteMessage('Chưa có dữ liệu nét cho chữ này.', 'wrong');
            return;
        }
        if (expectedStroke >= modelPathEls.length) {
            setWriteMessage('Đã viết đủ chữ này! Chọn chữ khác hoặc bấm 🗑 Xóa.', 'correct');
            return;
        }

        evt.preventDefault();
        drawing = true;
        drawingPoints = [svgPointFromEvent(evt)];
        drawingPathEl = document.createElementNS(SVG_NS, 'path');
        drawingPathEl.setAttribute('class', 'user-stroke');
        drawingPathEl.setAttribute('d', '');
        document.getElementById('write-user').appendChild(drawingPathEl);

        if (writeSvg.setPointerCapture) writeSvg.setPointerCapture(evt.pointerId);
    }

    function onWritePointerMove(evt) {
        if (!drawing) return;
        const point = svgPointFromEvent(evt);
        const last = drawingPoints[drawingPoints.length - 1];
        if (Math.hypot(point.x - last.x, point.y - last.y) < 1.2) return;
        drawingPoints.push(point);
        drawingPathEl.setAttribute('d', pointsToPathData(drawingPoints));
    }

    function onWritePointerUp() {
        if (!drawing) return;
        drawing = false;
        if (drawingPathEl) drawingPathEl.setAttribute('d', pointsToPathData(drawingPoints));
        finishStroke();
    }

    // Chấm điểm mức A: đúng số nét + đúng vị trí bắt đầu của từng nét
    function finishStroke() {
        const pathEl = drawingPathEl;
        const points = drawingPoints;
        drawingPathEl = null;
        drawingPoints = [];

        if (!pathEl) return;

        // Chấm chuột/nhấp quá ngắn → bỏ qua
        if (points.length < 3 || pathLengthOf(points) < 8) {
            pathEl.remove();
            return;
        }

        const model = modelPathEls[expectedStroke];
        if (!model) {
            pathEl.remove();
            return;
        }

        const modelStart = model.getPointAtLength(0);
        const modelEnd = model.getPointAtLength(model.getTotalLength());
        const startPoint = points[0];
        const endPoint = points[points.length - 1];
        const startDistance = Math.hypot(startPoint.x - modelStart.x, startPoint.y - modelStart.y);
        const endDistance = Math.hypot(endPoint.x - modelEnd.x, endPoint.y - modelEnd.y);

        // Sai điểm bắt đầu → coi như sai thứ tự nét, bỏ nét vừa vẽ
        if (startDistance > START_TOLERANCE) {
            pathEl.classList.add('wrong');
            setTimeout(() => pathEl.remove(), 700);
            setWriteMessage(`Sai thứ tự! Nét ${expectedStroke + 1} phải bắt đầu từ chấm số ${expectedStroke + 1}.`, 'wrong');
            return;
        }

        userStrokeEls.push(pathEl);
        expectedStroke++;
        updateStrokeProgress();
        drawStartMarker();

        if (expectedStroke >= modelPathEls.length) {
            writeScore++;
            writeScoreVal.textContent = writeScore;
            const tip = endDistance > END_TOLERANCE ? ' (Nét cuối hơi lệch nhưng vẫn đạt!)' : '';
            setWriteMessage(`Chính xác! Viết đủ ${modelPathEls.length} nét.${tip}`, 'correct');
            clearTimeout(writeAdvanceTimer);
            writeAdvanceTimer = setTimeout(nextWriteChar, 1800);
            return;
        }

        if (endDistance > END_TOLERANCE) {
            setWriteMessage(`Nét ${expectedStroke} xong (đuôi hơi lệch). Vẽ tiếp nét ${expectedStroke + 1}.`, '');
        } else {
            setWriteMessage(`Nét ${expectedStroke} đúng! Vẽ tiếp nét ${expectedStroke + 1}.`, 'correct');
        }
    }

    function nextWriteChar() {
        const dataList = writeData();
        let next = writeChar;
        while (next === writeChar && dataList.length > 1) {
            next = dataList[Math.floor(Math.random() * dataList.length)].char;
        }
        selectKana(next);
    }

    function undoStroke() {
        if (drawing) return;
        clearTimeout(writeAdvanceTimer);
        if (expectedStroke === 0) {
            setWriteMessage('Chưa có nét nào để lùi.', '');
            return;
        }

        expectedStroke--;
        const removed = userStrokeEls.pop();
        if (removed) removed.remove();
        updateStrokeProgress();
        drawStartMarker();
        setWriteMessage(`Đã lùi. Vẽ lại nét ${expectedStroke + 1}.`, '');
    }

    function clearStrokes() {
        if (drawing) return;
        clearTimeout(writeAdvanceTimer);
        document.getElementById('write-user').innerHTML = '';
        userStrokeEls = [];
        expectedStroke = 0;
        updateStrokeProgress();
        drawStartMarker();
        setWriteMessage('Đã xóa. Vẽ nét 1 từ chấm xanh.', '');
    }

    function playWriteAudio() {
        playAudio(writeChar);
    }

    // Xem mẫu: vẽ lần lượt từng nét theo đúng thứ tự
    function animateModel() {
        if (demoRunning || !modelPathEls.length) return;
        demoRunning = true;
        setWriteMessage('Đang xem mẫu...', '');

        const steps = modelPathEls.map(path => {
            const length = path.getTotalLength();
            path.style.transition = 'none';
            path.style.strokeDasharray = length;
            path.style.strokeDashoffset = length;
            return path;
        });

        let index = 0;
        const drawNext = () => {
            if (index >= steps.length) {
                setTimeout(() => {
                    steps.forEach(path => {
                        path.style.transition = '';
                        path.style.strokeDasharray = '';
                        path.style.strokeDashoffset = '';
                    });
                    demoRunning = false;
                    setWriteMessage('Vẽ nét 1 từ chấm xanh.', '');
                }, 300);
                return;
            }

            const path = steps[index];
            path.getBoundingClientRect();
            path.style.transition = 'stroke-dashoffset 0.55s ease-in-out';
            path.style.strokeDashoffset = 0;
            index++;
            setTimeout(drawNext, 620);
        };

        drawNext();
    }

    // =================== KHỞI TẠO ===================
    const initialHash = location.hash.slice(1);
    showScreen(initialHash || 'home');

</script>
